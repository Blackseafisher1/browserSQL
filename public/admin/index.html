<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin - browserSQL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#111;color:#eee;padding:2rem;max-width:800px;margin:auto}
h1{font-size:1.5rem;margin-bottom:1rem}
#login{display:flex;gap:.5rem;margin-bottom:1rem}
input{padding:.5rem;background:#222;border:1px solid #444;color:#eee;border-radius:4px;flex:1}
button{padding:.5rem 1rem;background:#3b82f6;color:#fff;border:none;border-radius:4px;cursor:pointer}
button.danger{background:#ef4444}
.user{margin-bottom:1rem;border:1px solid #333;border-radius:6px;padding:1rem}
.user h2{font-size:1.1rem;margin-bottom:.5rem}
.user h2 span{font-weight:400;color:#888;font-size:.9rem}
.file{display:flex;justify-content:space-between;align-items:center;padding:.3rem 0;font-size:.9rem;border-bottom:1px solid #222}
.file:last-child{border:0}
.error{color:#ef4444}
.loading{color:#888}
.hidden{display:none}
.success{color:#22c55e;margin-top:.5rem}
</style>
</head>
<body>
<h1>🔧 Admin Panel</h1>
<div id="login">
  <input type="password" id="pw" placeholder="Admin password" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">Login</button>
</div>
<div id="error" class="error"></div>
<div id="success" class="success"></div>
<div id="content"></div>

<script>
const API_BASE = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
  ? 'http://localhost:8081'
  : 'https://ideaboard.site';

async function api(path, opts) {
  const headers = { 'Content-Type': 'application/json' };
  const token = sessionStorage.getItem('admin_token');
  if (token) headers['Authorization'] = 'Basic ' + token;
  const r = await fetch(API_BASE + path, { ...opts, headers: { ...headers, ...opts?.headers } });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || 'HTTP ' + r.status); }
  return r.json();
}

async function login() {
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  document.getElementById('error').textContent = '';
  try {
    const r = await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password: pw }) });
    sessionStorage.setItem('admin_token', r.token);
    document.getElementById('login').classList.add('hidden');
    loadUsers();
  } catch (e) { document.getElementById('error').textContent = e.message; }
}

async function loadUsers() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="loading">Loading...</div>';
  try {
    const users = await api('/api/admin/users');
    let html = '';
    for (const u of users) {
      try {
        const { files } = await api('/api/admin/files/' + u.name);
        html += '<div class="user"><h2>' + u.name + ' <span>(' + files.length + ' files)</span></h2>';
        if (files.length === 0) html += '<div style="color:#666;font-size:.9rem">No files</div>';
        else html += files.map(f => '<div class="file"><span>' + f.name + '</span><button class="danger" onclick="del(\'' + u.name + '\',\'' + f.name.replace(/'/g, "\\'") + '\')">Delete</button></div>').join('');
        html += '</div>';
      } catch (e) { html += '<div class="user"><h2>' + u.name + '</h2><div class="error">Error loading files</div></div>'; }
    }
    el.innerHTML = html || '<div style="color:#666">No users found</div>';
  } catch (e) { el.innerHTML = '<div class="error">' + e.message + '</div>'; }
}

async function del(user, name) {
  if (!confirm('Delete "' + name + '" from user "' + user + '"?')) return;
  document.getElementById('success').textContent = '';
  try {
    await api('/api/admin/files/' + user + '/' + encodeURIComponent(name), { method: 'DELETE' });
    document.getElementById('success').textContent = 'Deleted ' + name;
    setTimeout(() => document.getElementById('success').textContent = '', 3000);
    loadUsers();
  } catch (e) { document.getElementById('error').textContent = e.message; }
}

if (sessionStorage.getItem('admin_token')) {
  document.getElementById('login').classList.add('hidden');
  loadUsers();
}
</script>
</body>
</html>
