<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin - browserSQL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#111;color:#eee;padding:2rem;max-width:800px;margin:auto}
h1{font-size:1.5rem;margin-bottom:1rem}
#login{display:flex;gap:.5rem;margin-bottom:1rem}
input{padding:.5rem;background:#222;border:1px solid #444;color:#eee;border-radius:4px;flex:1}
button{padding:.5rem 1rem;background:#3b82f6;color:#fff;border:none;border-radius:4px;cursor:pointer}
button.danger{background:#ef4444}
.user{border:1px solid #333;border-radius:6px;margin-bottom:.5rem;overflow:hidden}
.user-header{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;cursor:pointer;background:#1a1a1a}
.user-header:hover{background:#222}
.user-header h2{font-size:1rem;margin:0}
.user-header .arrow{color:#666;transition:transform .15s}
.user-header .arrow.open{transform:rotate(90deg)}
.user-body{padding:.5rem 1rem 1rem}
.user-body.collapsed{display:none}
.file{display:flex;justify-content:space-between;align-items:center;padding:.3rem 0;font-size:.9rem;border-bottom:1px solid #222}
.file:last-child{border:0}
.error{color:#ef4444}
.loading{color:#888}
.hidden{display:none}
.success{color:#22c55e;margin-top:.5rem;font-size:.9rem}
.storage-bar{height:4px;background:#333;border-radius:2px;margin-top:4px;max-width:200px;display:inline-block;vertical-align:middle}
.storage-fill{height:100%;background:#3b82f6;border-radius:2px;transition:width .3s}
.storage-fill.warning{background:#f59e0b}
.storage-fill.danger{background:#ef4444}
</style>
</head>
<body>
<h1>🔧 Admin Panel</h1>
<div id="login">
  <input type="password" id="pw" placeholder="Admin password" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">Login</button>
</div>
<div id="error" class="error"></div>
<div id="success" class="success"></div>
<div id="content"></div>

<script>
const API_BASE = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
  ? 'http://localhost:8081'
  : 'https://ideaboard.site';
const STORAGE_LIMIT = 100 * 1024 * 1024;

async function api(path, opts) {
  const headers = { 'Content-Type': 'application/json' };
  const token = sessionStorage.getItem('admin_token');
  if (token) headers['Authorization'] = 'Basic ' + token;
  const r = await fetch(API_BASE + path, { ...opts, headers: { ...headers, ...opts?.headers } });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || 'HTTP ' + r.status); }
  return r.json();
}

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

function storagePct(n) { return Math.min(100, (n / STORAGE_LIMIT) * 100); }

function storageClass(n) {
  const pct = storagePct(n);
  if (pct > 90) return 'danger';
  if (pct > 70) return 'warning';
  return '';
}

async function login() {
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  document.getElementById('error').textContent = '';
  try {
    const r = await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password: pw }) });
    sessionStorage.setItem('admin_token', r.token);
    document.getElementById('login').classList.add('hidden');
    loadUsers();
  } catch (e) { document.getElementById('error').textContent = e.message; }
}

async function loadUsers() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="loading">Loading...</div>';
  try {
    const users = await api('/api/admin/users');
    if (users.length === 0) { el.innerHTML = '<div style="color:#666">No users found</div>'; return; }
    let html = '';
    for (const u of users) {
      const pct = storagePct(u.storage);
      const cls = storageClass(u.storage);
      html += '<div class="user">';
      html += '<div class="user-header" onclick="toggleUser(this)">';
      html += '<h2>' + u.name + ' <span style="font-weight:400;color:#888;font-size:.85rem">' + u.files + ' files &middot; ' + fmtBytes(u.storage) + ' / 100 MB</span></h2>';
      html += '<span class="arrow">▸</span>';
      html += '</div>';
      html += '<div style="padding:0 1rem .3rem"><div class="storage-bar"><div class="storage-fill ' + cls + '" style="width:' + pct + '%"></div></div></div>';
      html += '<div class="user-body collapsed" id="body-' + u.name.replace(/[^a-zA-Z0-9]/g,'') + '">';
      html += '<div class="loading" id="load-' + u.name.replace(/[^a-zA-Z0-9]/g,'') + '">Loading files...</div>';
      html += '</div></div>';
    }
    el.innerHTML = html;
    for (const u of users) loadUserFiles(u.name);
  } catch (e) { el.innerHTML = '<div class="error">' + e.message + '</div>'; }
}

async function loadUserFiles(username) {
  const safeId = username.replace(/[^a-zA-Z0-9]/g, '');
  const body = document.getElementById('body-' + safeId);
  const loadEl = document.getElementById('load-' + safeId);
  try {
    const { files } = await api('/api/admin/files/' + encodeURIComponent(username));
    loadEl.remove();
    if (!files || files.length === 0) {
      body.innerHTML = '<div style="color:#666;font-size:.9rem">No files</div>';
      return;
    }
    body.innerHTML = files.map(f =>
      '<div class="file"><span>' + f.name + '</span><button class="danger" onclick="del(\'' + username + '\',\'' + f.name.replace(/'/g, "\\'") + '\')">Delete</button></div>'
    ).join('');
  } catch (e) {
    loadEl.remove();
    body.innerHTML = '<div class="error">Error loading files</div>';
  }
}

function toggleUser(header) {
  const body = header.nextElementSibling.nextElementSibling;
  const arrow = header.querySelector('.arrow');
  body.classList.toggle('collapsed');
  arrow.classList.toggle('open');
}

async function del(user, name) {
  if (!confirm('Delete "' + name + '" from user "' + user + '"?')) return;
  document.getElementById('success').textContent = '';
  try {
    await api('/api/admin/files/' + encodeURIComponent(user) + '/' + encodeURIComponent(name), { method: 'DELETE' });
    document.getElementById('success').textContent = 'Deleted ' + name;
    setTimeout(() => document.getElementById('success').textContent = '', 3000);
    loadUsers();
  } catch (e) { document.getElementById('error').textContent = e.message; }
}

if (sessionStorage.getItem('admin_token')) {
  document.getElementById('login').classList.add('hidden');
  loadUsers();
}
</script>
</body>
</html>
